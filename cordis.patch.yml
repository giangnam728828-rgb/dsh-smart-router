# dsh-smart-router bundle patch — one host row.
#
# The row is addressed by id, so it can be reconfigured or disabled later without
# touching this file:
#   - id: smart-router
#     disabled: true
#
# Every key under `config` is optional; the plugin clamps and defaults them itself,
# so a partial config is always valid.
- insert:
    - id: smart-router
      name: dsh-smart-router
      config:
        enabled: true
        # 每轮最多给几个技能候选。给太多等于没给。
        maxCandidates: 3
        # 只用来滤掉显然不相干的候选，不是「够不够用」的判定线。
        minScore: 0.012
        includePlugins: true
        pluginsLimit: 8
        includeToolFamilies: true
        familiesLimit: 10
        debug: false
